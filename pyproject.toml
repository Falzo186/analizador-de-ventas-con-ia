[project]
name = "ventia"
version = "0.1.0"
description = "Simulador de punto de venta + evaluador de precisión de un LLM local sobre datos de ventas"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Permite `import src.db...` desde las pruebas ejecutando pytest en la raíz.
pythonpath = ["."]
testpaths = ["tests"]
