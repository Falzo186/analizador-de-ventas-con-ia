[project]
name = "ventia"
version = "0.1.0"
description = "Chat con IA local + dashboard de 11 necesidades analíticas sobre el dataset Instacart 2017"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Permite `import src.db...` desde las pruebas ejecutando pytest en la raíz.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: prueba contra data/instacart.duckdb real; se salta si el archivo no existe.",
]
